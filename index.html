<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centinela Code - Asistente IA</title>
  <style>
    :root {
      --bg-color: #0b111e;
      --card-bg: #111a2e;
      --bot-msg-bg: #1c293d;
      --user-msg-bg: #1a365d;
      --accent-color: #0084ff;
      --text-main: #e2e8f0;
      --text-sub: #94a3b8;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 24px 32px 12px 32px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Area Principal de Chat */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 32px 16px 32px;
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid #1e2d4a;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.bot {
      background-color: var(--bot-msg-bg);
      align-self: flex-start;
      border-left: 4px solid var(--accent-color);
    }

    .message.user {
      background-color: var(--user-msg-bg);
      align-self: flex-end;
      text-align: right;
    }

    .message.error {
      background-color: #3b1719;
      color: var(--error-color);
      border: 1px solid #7f1d1d;
      align-self: stretch;
      max-width: 100%;
    }

    /* Formulario de entrada */
    .input-box {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      background-color: var(--card-bg);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #1e2d4a;
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      padding: 8px 12px;
    }

    .input-box input::placeholder {
      color: #475569;
    }

    .input-box button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-box button:hover {
      background-color: #0066cc;
    }

    .input-box button:disabled {
      background-color: #334155;
      cursor: not-allowed;
    }

    /* Navegación Inferior */
    nav {
      background-color: #080d17;
      border-top: 1px solid #1e2d4a;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #38bdf8;
      background-color: #0f233d;
      border: 1px solid #1d4ed8;
    }

    .nav-item span {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ASISTENTE IA</h1>
    <p>Consultas operativas, encuadre legal y redacción.</p>
  </header>

  <main>
    <div class="chat-container" id="chatContainer">
      <div class="message bot">
        🤖 <strong>Centinela AI:</strong> Saludos, Agente. Indícame los hechos o la duda normativa y te ayudaré a calificar la infracción o redactar la diligencia.
      </div>
    </div>

    <form class="input-box" id="chatForm">
      <input type="text" id="userInput" placeholder="Ej: Negativa a identificarse en vía pública..." autocomplete="off" required />
      <button type="submit" id="sendBtn">ENVIAR</button>
    </form>
  </main>

  <nav>
    <div class="nav-item"><span>🏠</span>INICIO</div>
    <div class="nav-item"><span>🔍</span>CONSULTA</div>
    <div class="nav-item"><span>📝</span>ACTAS</div>
    <div class="nav-item"><span>⚖️</span>NORMATIVA</div>
    <div class="nav-item active"><span>🤖</span>IA</div>
  </nav>

  <script>
    const API_KEY = "AQ.Ab8RN6KwUI-n-m3Njun0GjJNvvmBBsAyJGe6ehJTEcv-T_m8eA";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const SYSTEM_INSTRUCTION = `Eres Centinela AI, un asistente virtual policial experto en el ordenamiento jurídico español (Ley Orgánica 4/2015 de Protección de la Seguridad Ciudadana, Código Penal, Reglamento General de Circulación y ordenanzas locales). Tu función es ayudar a agentes de la autoridad a calificar legalmente intervenciones, redactar actas, diligencias policiales y resolver dudas operativas de manera clara, concisa, rigurosa y directa.`;

    const chatContainer = document.getElementById('chatContainer');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Historial de conversación
    let conversationHistory = [];

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // Mostrar mensaje del usuario
      appendMessage(text, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      // Añadir al historial de la petición
      conversationHistory.push({ role: "user", parts: [{ text: text }] });

      // Mensaje temporal de carga
      const loadingDiv = appendMessage("Pensando...", 'bot');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: conversationHistory
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Error en la petición (${response.status})`);
        }

        const botReply = data.candidates[0].content.parts[0].text;
        
        // Guardar respuesta en el historial
        conversationHistory.push({ role: "model", parts: [{ text: botReply }] });

        // Actualizar mensaje de la IA
        loadingDiv.innerHTML = `🤖 <strong>Centinela AI:</strong> ${formatText(botReply)}`;

      } catch (err) {
        loadingDiv.className = "message error";
        loadingDiv.innerHTML = `❌ Error al conectar con la IA: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    function appendMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      if (type === 'user') {
        msgDiv.textContent = text;
      } else {
        msgDiv.innerHTML = text;
      }
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
