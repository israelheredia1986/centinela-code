name: Assemble exact ZIP replacement
on:
  push:
    branches: [main]
    paths:
      - 'tmp_update/READY_PAYLOAD_SMALL'
permissions:
  contents: write
jobs:
  assemble:
    if: ${{ hashFiles('tmp_update/READY_PAYLOAD_SMALL') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact files
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_update/zip_payload_small/app/*.part > /tmp/app.b64
          cat tmp_update/zip_payload_small/traf/*.part > /tmp/traf.b64
          base64 -d /tmp/app.b64 | gzip -dc > /tmp/app.js
          base64 -d /tmp/traf.b64 | gzip -dc > /tmp/infracciones_trafico.json
          cmp /tmp/app.js tmp_update/zip_payload_small/app/001.part >/dev/null 2>&1 || true
          mv /tmp/app.js app.js
          mv /tmp/infracciones_trafico.json data/infracciones_trafico.json
          rm -rf tmp_update
          rm -f .github/workflows/assemble-zip-update.yml .github/workflows/assemble-final2.yml .github/workflows/assemble-final3.yml .github/workflows/assemble-compressed.yml .github/workflows/assemble-payload.yml .github/workflows/assemble-small-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace files with versions from provided ZIP"
          git push
