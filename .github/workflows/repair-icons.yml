name: Reparar iconos visibles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Restaurar iconos Unicode sin data-uri
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>'
          fix = '''<style id="centinela-visible-icons-fix">
          .quick-action-icon{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Arial Unicode MS",sans-serif!important;font-size:92px!important;line-height:1!important;display:grid!important;place-items:center!important;color:currentColor!important;text-shadow:0 0 10px currentColor!important;background:none!important;-webkit-mask:none!important;mask:none!important}
          .quick-action-icon:before{content:none!important;display:none!important;background:none!important;-webkit-mask:none!important;mask:none!important}
          .nav-item .nav-icon{width:auto!important;height:auto!important;min-width:30px!important;min-height:30px!important;font-family:"Segoe UI Emoji","Segoe UI Symbol","Noto Sans Symbols 2",sans-serif!important;font-size:29px!important;line-height:1!important;display:grid!important;place-items:center!important;color:currentColor!important;text-shadow:0 0 9px currentColor!important;background:none!important;-webkit-mask:none!important;mask:none!important}
          .nav-item .nav-icon:before{content:none!important;display:none!important;background:none!important;-webkit-mask:none!important;mask:none!important}
          .search-icon{width:auto!important;height:auto!important;font-size:25px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;position:static!important;color:currentColor!important;background:none!important;-webkit-mask:none!important;mask:none!important}
          .search-icon:before{content:none!important;display:none!important;background:none!important;-webkit-mask:none!important;mask:none!important}
          @media(max-width:560px){.quick-action-icon{font-size:72px!important}.nav-item .nav-icon{font-size:27px!important}}
          </style>
          '''
          if 'id="centinela-visible-icons-fix"' in s:
              raise SystemExit('El arreglo de iconos ya está instalado')
          if marker not in s:
              raise SystemExit('No se encontró el punto de inserción esperado')
          s = s.replace(marker, '</style>\n' + fix + '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>', 1)
          p.write_text(s, encoding='utf-8')
          print('Iconos restaurados')
          PY

      - name: Verificar ausencia de data-uri SVG
        run: |
          ! grep -Fq 'data:image/svg+xml' index.html

      - name: Verificar HTML básico
        run: |
          test -s index.html
          grep -q '<html' index.html
          grep -q '</html>' index.html

      - name: Validar y publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restaura iconos visibles sin SVG data-uri'
          git push

      - name: Eliminar workflow temporal
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/repair-icons.yml
          git add -A
          git commit -m 'Eliminar workflow temporal de iconos' || exit 0
          git push
