              'id':'CONTR-LO12-11-3-PRECINTOS','codigo':'11.3','ley':'Ley Orgánica 12/1995','articulo':'11.3','gravedad':'Muy Grave','titulo':'Rotura de precintos y quebrantamiento de cierre o suspensión','conducta':'Rotura del precinto de máquinas expendedoras de tabaco objeto de medida legal, rotura de precintos en establecimientos cerrados o realización de actividades durante el cierre, o quebrantamiento de la suspensión del ejercicio de actividad objeto del contrabando.','sancion':{'tipo':'especial','detalle':'Artículo 12.3: doble del importe de la sanción pecuniaria acordada en el expediente que decretó el cierre o suspensión, más la sanción adicional de cierre o extensión temporal prevista en la ley.'},
              'palabrasClave':['precinto','precintos','rotura de precinto','cierre','suspension','suspensión','maquina expendedora','máquina expendedora','tabaco','contrabando'],'fuente':'BOE'
