              'gravedad':'Administrativa','titulo':'Infracción administrativa de contrabando','conducta':'Las acciones u omisiones tipificadas en los apartados 1 y 2 del artículo 2 de la Ley Orgánica 12/1995, realizadas dolosamente o con cualquier grado de negligencia, cuando no constituyan delito de contrabando.','sancion':{'tipo':'multa proporcional','detalle':'La cuantía depende de la clase de infracción y del valor y naturaleza de los bienes conforme al artículo 12.'},
              'palabrasClave':['contrabando','aduana','mercancia','mercancía','importacion','importación','exportacion','exportación','tenencia','circulacion','circulación','ocultacion','ocultación','no declarada','tabaco','alcohol','bebidas alcoholicas','bebidas alcohólicas'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-11-TABACO','codigo':'11.2-TABACO','ley':'Ley Orgánica 12/1995','articulo':'11.2','gravedad':'Leve/Grave/Muy Grave','titulo':'Clasificación de infracciones de contrabando de labores de tabaco','conducta':'Las infracciones relativas a labores de tabaco se clasifican según el valor: leve inferior a 1.000 €; grave de 1.000 € a 6.000 €; muy grave superior a 6.000 €, en los supuestos del artículo 2.2, sin perjuicio de los restantes umbrales del artículo 11.','sancion':{'tipo':'multa proporcional','detalle':'Para labores de tabaco, artículo 12.2: leve 200-300 %, grave 300-450 %, muy grave 450-600 %, mínimo 2.000 €, además del cierre del establecimiento en los términos legales.'},
              'palabrasClave':['tabaco','contrabando','cigarrillos','cigarros','cigarritos','picadura','tabaco de liar','precinta','marcas fiscales','labores de tabaco','1.000','6.000','multa','cierre'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-11-GENERAL-CLASE','codigo':'11.2','ley':'Ley Orgánica 12/1995','articulo':'11.2','gravedad':'Leve/Grave/Muy Grave','titulo':'Clasificación general de las infracciones administrativas de contrabando','conducta':'En los supuestos del artículo 2.1, las infracciones son leves si el valor es inferior a 37.500 €, graves de 37.500 € a 112.500 € y muy graves por encima de 112.500 €. En los supuestos del artículo 2.2, son leves por debajo de 6.000 €, graves de 6.000 € a 18.000 € y muy graves por encima de 18.000 €, salvo la escala específica de labores de tabaco.','sancion':{'tipo':'multa proporcional','detalle':'Artículo 12.1: leves 100-150 %, graves 150-250 %, muy graves 250-350 %, mínimo 500 €.'},
              'palabrasClave':['contrabando','leve','grave','muy grave','37.500','112.500','6.000','18.000','multa','valor de la mercancía'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-12-GENERAL','codigo':'12.1','ley':'Ley Orgánica 12/1995','articulo':'12.1','gravedad':'Leve/Grave/Muy Grave','titulo':'Multas generales por infracción administrativa de contrabando','conducta':'Responsabilidad por infracción administrativa de contrabando no incluida en el régimen especial del artículo 12.2.','sancion':{'leve':{'minPorcentaje':100,'maxPorcentaje':150,'multaMin':500},'grave':{'minPorcentaje':150,'maxPorcentaje':250,'multaMin':500},'muyGrave':{'minPorcentaje':250,'maxPorcentaje':350,'multaMin':500},'unidad':'EUR'},
              'palabrasClave':['contrabando','multa','100%','150%','250%','350%','500 euros','sancion','sanción'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-12-ART2-2','codigo':'12.2','ley':'Ley Orgánica 12/1995','articulo':'12.2','gravedad':'Leve/Grave/Muy Grave','titulo':'Multas especiales de contrabando para géneros del artículo 2.2','conducta':'Régimen sancionador especial para infracciones administrativas relativas a los bienes incluidos en el artículo 2.2.','sancion':{'leve':{'minPorcentaje':200,'maxPorcentaje':225,'multaMin':1000},'grave':{'minPorcentaje':225,'maxPorcentaje':275,'multaMin':1000},'muyGrave':{'minPorcentaje':275,'maxPorcentaje':350,'multaMin':1000},'nota':'Cuando se trate de labores de tabaco se aplican 200-300 %, 300-450 % y 450-600 %, respectivamente, con mínimo de 2.000 €.'},
              'palabrasClave':['contrabando','generos estancados','géneros estancados','prohibidos','articulo 2.2','artículo 2.2','multa proporcional'],'fuente':'BOE'
