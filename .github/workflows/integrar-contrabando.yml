name: Integrate contraband legislation and sanctions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrar-contrabando.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate contraband database
        shell: python
        run: |
          import json
          from pathlib import Path

          data_path = Path('data/infracciones.json')
          root = json.loads(data_path.read_text(encoding='utf-8'))
          items = root.get('infracciones', [])
          existing = {str(x.get('id','')) for x in items if isinstance(x, dict)}

          common = [
            {
