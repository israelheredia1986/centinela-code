            {
              'id':'CONTR-LO12-12-TABACO','codigo':'12.2-TABACO','ley':'Ley Orgánica 12/1995','articulo':'12.2','gravedad':'Leve/Grave/Muy Grave','titulo':'Sanción específica por contrabando de labores de tabaco','conducta':'En infracciones administrativas de contrabando relativas a labores de tabaco, la multa se calcula sobre el valor de las labores y se acompaña de cierre del establecimiento en los términos del artículo 12.2.','sancion':{'leve':{'minPorcentaje':200,'maxPorcentaje':300,'multaMin':2000},'grave':{'minPorcentaje':300,'maxPorcentaje':450,'multaMin':2000},'muyGrave':{'minPorcentaje':450,'maxPorcentaje':600,'multaMin':2000},'cierre':{'leve':'7 días a 6 meses','grave':'6 meses y 1 día a 12 meses','muyGrave':'12 meses y 1 día a 24 meses','reiteracionMuyGrave':'Puede ser definitivo en los supuestos legalmente previstos'}},
              'palabrasClave':['tabaco','contrabando','cigarrillos','cigarros','cigarritos','picadura','multa','200%','300%','450%','600%','2.000 euros','cierre'],'fuente':'BOE'
            },
