              'palabrasClave':['contrabando','resistencia','obstruccion','obstrucción','negativa','requerimiento','documentacion','documentación','comparecencia','1.000 euros'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-12-4-RESISTENCIA-GRAVE','codigo':'12.4-b','ley':'Ley Orgánica 12/1995','articulo':'11.4 y 12.4','gravedad':'Grave','titulo':'Resistencia, negativa u obstrucción: infracción grave','conducta':'Negar o impedir indebidamente la entrada o permanencia en fincas o locales, impedir reconocimientos o ejercer coacciones a autoridades, funcionarios o fuerzas en el ejercicio de las funciones previstas en la Ley de Represión del Contrabando.','sancion':{'detalle':'3.000 €; en el supuesto del artículo 11.4.e), coacciones, 5.000 € cuando no tenga la consideración de delito.','unidad':'EUR'},
              'palabrasClave':['contrabando','resistencia','obstruccion','obstrucción','coacciones','autoridad','funcionario','fuerzas','entrada','locales','3.000 euros','5.000 euros'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-2-TABACO-DELITO','codigo':'2.3.b','ley':'Ley Orgánica 12/1995','articulo':'2.3.b','gravedad':'Delito','titulo':'Delito de contrabando de labores de tabaco por valor','conducta':'Comete delito de contrabando quien realice las conductas legalmente tipificadas cuando se trate de labores de tabaco cuyo valor sea igual o superior a 15.000 €.','sancion':{'detalle':'Remisión a régimen penal del artículo 3: prisión de 1 a 5 años y multa del tanto al séxtuplo del valor, con las reglas de agravación y atenuación del propio artículo.'},
              'palabrasClave':['tabaco','contrabando','delito','15.000 euros','cigarrillos','cigarros','labores de tabaco','prision','prisión','multa'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-2-GENERAL-DELITO','codigo':'2.1','ley':'Ley Orgánica 12/1995','articulo':'2.1','gravedad':'Delito','titulo':'Delito de contrabando de mercancías en general','conducta':'Con carácter general, las conductas tipificadas en el artículo 2.1 constituyen delito cuando el valor de los bienes, mercancías, géneros o efectos sea igual o superior a 150.000 €.','sancion':{'detalle':'Artículo 3: prisión de 1 a 5 años y multa del tanto al séxtuplo del valor, con las reglas especiales legalmente previstas.'},
              'palabrasClave':['contrabando','delito','mercancia','mercancía','importacion','importación','exportacion','exportación','aduana','150.000 euros','prision','prisión','multa'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-2-2-DELITO','codigo':'2.2','ley':'Ley Orgánica 12/1995','articulo':'2.2','gravedad':'Delito','titulo':'Delito de contrabando de géneros estancados, prohibidos y otros bienes regulados','conducta':'Determinadas operaciones de importación, exportación, comercio o tenencia de géneros estancados o prohibidos y otros bienes sometidos a controles especiales constituyen delito cuando el valor alcanza 50.000 €, salvo los supuestos especiales del artículo 2.3.','sancion':{'detalle':'Artículo 3: prisión de 1 a 5 años y multa del tanto al séxtuplo del valor, con reglas de agravación/atenuación.'},
              'palabrasClave':['contrabando','delito','generos estancados','géneros estancados','prohibidos','50.000 euros','aduana','importacion','importación','exportacion','exportación'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-3-COMISO','codigo':'5','ley':'Ley Orgánica 12/1995','articulo':'5','gravedad':'Medida complementaria','titulo':'Comiso de bienes, efectos, instrumentos y ganancias','conducta':'Los bienes, efectos e instrumentos del contrabando quedan sujetos al régimen de comiso previsto legalmente; en determinados supuestos alcanza también ganancias y patrimonio procedente de actividad delictiva organizada.','sancion':{'tipo':'comiso','detalle':'Comiso conforme al artículo 5 y régimen complementario aplicable a las infracciones administrativas por remisión del artículo 14.'},
              'palabrasClave':['contrabando','comiso','decomiso','decomisar','aprehension','aprehensión','bienes','efectos','instrumentos','ganancias'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-14-APREHENSION','codigo':'14.2','ley':'Ley Orgánica 12/1995','articulo':'14.2','gravedad':'Medida cautelar','titulo':'Aprehensión cautelar en infracciones administrativas de contrabando','conducta':'Antes de iniciar el procedimiento sancionador, las autoridades, funcionarios y fuerzas competentes procederán a la aprehensión cautelar de bienes, efectos e instrumentos que puedan resultar decomisados conforme a la Ley.','sancion':{'tipo':'medida cautelar','detalle':'Aprehensión cautelar y custodia conforme al régimen legal.'},
              'palabrasClave':['contrabando','aprehension','aprehensión','intervencion','intervención','decomiso','decomisar','mercancia','mercancía','tabaco','alcohol','aduana'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-14BIS','codigo':'14 bis','ley':'Ley Orgánica 12/1995','articulo':'14 bis','gravedad':'Procedimiento','titulo':'No concurrencia de sanciones administrativas y delito','conducta':'Cuando los hechos pudieran ser constitutivos de delito de contrabando se remiten a la jurisdicción competente o al Ministerio Fiscal y se suspende el procedimiento administrativo sancionador. Las sanciones administrativas de contrabando son compatibles con la exigencia de la deuda tributaria y aduanera e intereses.','sancion':{'detalle':'No procede duplicar sanción administrativa por los mismos hechos cuando exista sentencia condenatoria por delito de contrabando.'},
              'palabrasClave':['contrabando','delito','ministerio fiscal','juzgado','suspension','suspensión','no concurrencia','deuda tributaria','deuda aduanera','intereses'],'fuente':'BOE'
            },
            {
              'id':'CONTR-LO12-15-PRESCRIPCION','codigo':'15','ley':'Ley Orgánica 12/1995','articulo':'15','gravedad':'Procedimiento','titulo':'Prescripción del contrabando administrativo','conducta':'Las infracciones administrativas de contrabando prescriben a los cuatro años desde el día de su comisión. Las sanciones impuestas prescriben a los cuatro años desde el día siguiente a la firmeza de la resolución sancionadora.','sancion':{'detalle':'Prescripción: 4 años.'},
              'palabrasClave':['contrabando','prescripcion','prescripción','cuatro años','4 años','sancion','sanción'],'fuente':'BOE'
            },
            {
              'id':'CONTR-L38-19-GRAVE','codigo':'19.2-19.3','ley':'Ley 38/1992, de Impuestos Especiales','articulo':'19','gravedad':'Grave','titulo':'Impuestos especiales: fabricación, importación y tenencia/circulación irregular','conducta':'Constituyen infracciones tributarias graves, entre otras, la fabricación o importación incumpliendo las condiciones legales, la circulación comercial sin la documentación electrónica exigible y la tenencia con fines comerciales sin acreditar el pago del impuesto, régimen suspensivo o exención.','sancion':{'tipo':'multa proporcional','detalle':'En los supuestos de las letras a), b) y c) del artículo 19.2, multa del 100 % de las cuotas que corresponderían a las cantidades de productos, con mínimo de 1.200 €; con reglas específicas para otros incumplimientos.'},
              'palabrasClave':['impuestos especiales','contrabando','alcohol','tabaco','bebidas alcoholicas','bebidas alcohólicas','circulacion','circulación','tenencia','fines comerciales','cuota','1.200 euros','fabricacion','fabricación','importacion','importación'],'fuente':'BOE'
            },
            {
              'id':'CONTR-L38-MARCAS','codigo':'19-ESPECIAL','ley':'Ley 38/1992, de Impuestos Especiales','articulo':'19 y concordantes','gravedad':'Leve/Especial','titulo':'Tenencia comercial de alcohol o tabaco sin marcas fiscales','conducta':'La tenencia con fines comerciales de bebidas alcohólicas o labores del tabaco que no ostenten las marcas fiscales exigibles, o las ostenten incumpliendo los requisitos reglamentarios, tiene un régimen sancionador tributario específico, salvo que resulte aplicable un supuesto más grave.','sancion':{'detalle':'Régimen específico por cantidad: 150 € por cada 1.000 cigarrillos (mínimo 600 €); 90 € por cada kg de picadura para liar (mínimo 600 €); 10 € por cada litro de bebidas (mínimo 600 €), con incremento del 25 % por comisión repetida en los términos legales.'},
              'palabrasClave':['tabaco','alcohol','bebidas alcohólicas','bebidas alcoholicas','marcas fiscales','precintas','precinta','cigarrillos','picadura','tabaco de liar','litros','600 euros','150 euros','90 euros','10 euros'],'fuente':'BOE'
            }
          ]

          for item in common:
              if item['id'] not in existing:
                  items.append(item)

          root['infracciones'] = items
          root['version'] = '1.2.0'
          root['ultimaActualizacionBOE'] = '2026-09-04'
          data_path.write_text(json.dumps(root, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Update service worker cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CENTINELA CODE — SERVICE WORKER V29','CENTINELA CODE — SERVICE WORKER V32')
          s=s.replace('centinela-code-v31-infra-assistant','centinela-code-v32-contrabando')
          s=s.replace('"./infraccion-assistant.js?v=20260904-infra-v2",','')
          if '"./data/contrabando.json"' not in s:
              s=s.replace('"./data/infracciones.json",','"./data/infracciones.json","./data/contrabando.json",')
          p.write_text(s,encoding='utf-8')
      - name: Validate JSON and commit
        run: |
          python -m json.tool data/infracciones.json >/dev/null
          python -m json.tool data/contrabando.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/infracciones.json data/contrabando.json service-worker.js
          git commit -m 'DATA: integrate contraband law and sanctions for tobacco alcohol and goods' || exit 0
          git rm .github/workflows/integrar-contrabando.yml
          git commit -m 'chore: remove contraband integration workflow'
          git push
