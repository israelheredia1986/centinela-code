name: Desplegar Centinela IA

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/centinela-ia/**'
      - '.github/workflows/deploy-centinela-ia.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Desplegar Edge Function centinela-ia
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF en los secretos de GitHub."
            exit 1
          fi
          supabase functions deploy centinela-ia --project-ref "$SUPABASE_PROJECT_REF" --workdir .
