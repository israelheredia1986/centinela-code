name: Desplegar Centinela IA

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/centinela-ia/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-centinela-ia.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2

      - name: Validar Edge Function
        run: deno check supabase/functions/centinela-ia/index.ts

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Comprobar configuración
        run: |
          test -f supabase/config.toml
          grep -q 'verify_jwt = true' supabase/config.toml

      - name: Desplegar Edge Function centinela-ia
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: okuygqbaliaeavhyezri
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub Actions."
            exit 1
          fi
          supabase functions deploy centinela-ia --project-ref "$SUPABASE_PROJECT_REF" --workdir .
