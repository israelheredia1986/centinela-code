name: Reparar SVG data-uri inválidas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Eliminar data:image SVG del HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r'url\(\s*([\"\']?)data:image/svg\+xml;base64,[^)]*?\1\s*\)', re.I)
          s2, n = pat.subn('none', s)
          if n == 0:
              raise SystemExit('No se encontraron data:image/svg+xml para reparar')
          p.write_text(s2, encoding='utf-8')
          print(f'Reparaciones realizadas: {n}')
          PY

      - name: Comprobar que no quedan SVG data-uri
        run: |
          ! grep -Fq 'data:image/svg+xml' index.html

      - name: Validar HTML básico
        run: |
          test -s index.html
          grep -q '<html' index.html
          grep -q '</html>' index.html

      - name: Commit de la reparación y eliminar este workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-invalid-svg.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/repair-invalid-svg.yml
          git commit -m 'Elimina SVG data-uri inválidas del index' || exit 0
          git push
