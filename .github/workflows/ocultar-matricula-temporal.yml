name: Ocultar temporalmente Matrícula

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocultar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ocultar Matrícula sin borrar datos ni funcionalidad
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* CENTINELA: MATRÍCULA OCULTA TEMPORALMENTE */'
          if marker not in s:
              s += '\n\n' + marker + '''\n.matriculas-card,.matricula-card,.matricula-tab,.tab-matricula,.nav-matricula,#matricula,#matriculas,#tab-matricula,#tab-matriculas,[data-section*="matric" i],[data-target*="matric" i],[aria-label*="matric" i],.nav-item[id*="matric" i],button[onclick*="matric" i]{display:none!important;}\n'''
              p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "Sin cambios necesarios"
          else
            git commit -m "Ocultar pestaña Matrícula temporalmente"
            git push
          fi

      - name: Eliminar este workflow temporal
        shell: bash
        run: |
          git rm .github/workflows/ocultar-matricula-temporal.yml
          git commit -m "Eliminar workflow temporal de ocultación"
          git push
