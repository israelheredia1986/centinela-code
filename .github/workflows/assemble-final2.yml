name: Assemble final ZIP update 2
on:
  push:
    branches: [main]
    paths:
      - 'tmp_update/FINAL_READY2'

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ hashFiles('tmp_update/FINAL_READY2') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble exact ZIP files
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_update/finalapp2/*.part > app.js
          cat tmp_update/finaltraf2/*.part > data/infracciones_trafico.json
          rm -rf tmp_update
          rm -f .github/workflows/assemble-zip-update.yml .github/workflows/assemble-final2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace files with versions from provided ZIP"
          git push
