name: Ajustar asistente de infracciones
on:
  push:
    paths:
      - '.github/workflows/ajustar-asistente-infracciones.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir acceso a datos globales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('infraccion-assistant.js')
          s=p.read_text(encoding='utf-8')
          old="const e=window.estado||{}; let arr=Array.isArray(e.infracciones)?e.infracciones:[];"
          new="const e=(typeof estado!=='undefined'?estado:(window.estado||{})); let arr=Array.isArray(e.infracciones)?e.infracciones:[];"
          if old not in s: raise SystemExit('No se encontró el acceso a estado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "centinela-bot"
          git config user.email "centinela-bot@users.noreply.github.com"
          git add infraccion-assistant.js
          git commit -m "Corregir acceso del identificador a la base local"
          git push
      - name: Eliminar workflow temporal
        run: |
          git rm .github/workflows/ajustar-asistente-infracciones.yml
          git commit -m "Eliminar workflow temporal del asistente"
          git push
