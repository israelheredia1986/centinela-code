name: Assemble exact ZIP files v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact files from ZIP payload
        if: ${{ hashFiles('tmp_transfer/READY') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_transfer/app/*.part | tr -d '\r\n' > /tmp/app.b64
          cat tmp_transfer/traf/*.part | tr -d '\r\n' > /tmp/traf.b64
          base64 -d /tmp/app.b64 | gzip -dc > app.js
          base64 -d /tmp/traf.b64 | gzip -dc > data/infracciones_trafico.json
          python - <<'PY'
          import hashlib
          checks={
            'app.js':'fcbbd5a77840095e9f82ab181e1fccf877118227',
            'data/infracciones_trafico.json':'960b45d2fad4bd963fe245652c8dce31b57c0db7',
          }
          for path,expected in checks.items():
            b=open(path,'rb').read()
            got=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
            if got!=expected:
              raise SystemExit(f'{path}: expected {expected}, got {got}')
          print('ZIP blob SHA verification OK')
          PY
          rm -rf tmp_transfer
          rm -f .github/workflows/assemble-zip-update.yml .github/workflows/assemble-final2.yml .github/workflows/assemble-final3.yml .github/workflows/assemble-compressed.yml .github/workflows/assemble-payload.yml .github/workflows/assemble-small-final.yml .github/workflows/assemble-small-final2.yml .github/workflows/assemble-any-final.yml .github/workflows/assemble-exact-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace files with versions from provided ZIP"
          git push
