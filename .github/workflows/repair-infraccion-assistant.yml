name: Repair infringement assistant loading

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index and service worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          script = '<script defer src="./infraccion-assistant.js?v=20260904-infra-v2"></script>'
          if 'infraccion-assistant.js' not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, script + '\n' + marker, 1)
              else:
                  s += '\n' + script + '\n'
          p.write_text(s, encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const CACHE_NAME="centinela-code-v29-vmp-bicicletas";', 'const CACHE_NAME="centinela-code-v30-infra-assistant";')
          if '"./infraccion-assistant.js?v=20260904-infra-v2"' not in s:
              s = s.replace('"./app.js",', '"./app.js","./infraccion-assistant.js?v=20260904-infra-v2",', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix: load infringement assistant and refresh SW cache"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/repair-infraccion-assistant.yml 2>/dev/null || true
          git rm -f .github/workflows/repair-infraccion-assistant.yml 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: remove temporary repair workflow" && git push)
