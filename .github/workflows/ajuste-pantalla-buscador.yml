name: Reparar Centinela Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reparar:
    if: ${{ !contains(github.event.head_commit.message, '[auto-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar y reparar componentes sin romper versiones actuales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # ------------------------------------------------------------
          # 1) Limpiar referencia antigua si todavía existe.
          # ------------------------------------------------------------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for ref in (
              '<script src="./infraccion-assistant.js?v=20260904-v1"></script>',
              '<script src="infraccion-assistant.js?v=20260904-v1"></script>',
              '<script defer src="./infraccion-assistant.js?v=20260904-v1"></script>',
              '<script defer src="infraccion-assistant.js?v=20260904-v1"></script>',
          ):
              s = s.replace(ref, '')
          s = s.replace(
              '<strong>Ley Orgánica 4/2015</strong><small>Comprobando artículos disponibles</small>',
              '<strong>Normativa aplicable</strong><small>Comprobando referencias disponibles</small>',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # 2) Buscador: solo aplicar la mejora si todavía no está instalada.
          #    No se exige un texto exacto de una versión anterior.
          # ------------------------------------------------------------
          p = Path('buscadores-core.js')
          s = p.read_text(encoding='utf-8')

          alias_patch = '''    ensuciar:["ensuciado","ensuciamiento","suciedad","limpieza","residuos","basura","vertido","arrojar","tirar","via publica","calle","acera","calzada","papelera"],
    ensuciado:["ensuciar","ensuciamiento","suciedad","limpieza","residuos","basura","vertido","via publica","calle"],
    suciedad:["ensuciar","ensuciado","limpieza","residuos","basura","via publica","calle"],
    calle:["via publica","acera","calzada","limpieza","suciedad","residuos"],
    tirar:["arrojar","depositar","residuos","basura","suciedad","via publica"],
    arrojar:["tirar","depositar","residuos","basura","suciedad","via publica"]'''

          if 'ensuciar:[' not in s:
              marker = '    multa:["sancion","sanciones","infraccion","infracciones"]'
              pos = s.find(marker)
              if pos >= 0:
                  line_end = s.find('\n', pos)
                  s = s[:line_end] + ',\n' + alias_patch + s[line_end:]

          score_patch = '''    if(/ensuciar|ensuciado|suciedad|limpieza|residuo|residuos|basura|arrojar|tirar|calle|via publica|acera|calzada/.test(n)){
      if(/limpieza|residuo|residuos|basura|suciedad|higiene urbana|via publica|calle|acera|calzada|arrojar|ensuciar|tirar/.test(text))s+=260;
      if(/ordenanza/.test(norm(r.source)))s+=80;
    }'''
          if 'if(/ensuciar|ensuciado|suciedad|limpieza|' not in s:
              marker2 = '    if(/sancion|multa|infraccion/.test(n)&&r.isInfraction)s+=130;'
              pos = s.find(marker2)
              if pos >= 0:
                  line_end = s.find('\n', pos)
                  s = s[:line_end] + '\n' + score_patch + s[line_end:]

          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # 3) Refuerzo opcional de la ordenanza. No falla la ejecución si
          #    la estructura ya está actualizada o el registro no existe.
          # ------------------------------------------------------------
          p = Path('data/ordenanzas.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          target = next((o for o in data.get('ordenanzas', []) if o.get('id') == 'sr-residuos'), None)
          if target is not None:
              keywords = set(target.get('palabras_clave') or [])
              keywords.update({'ensuciar','ensuciado','ensuciamiento','suciedad','limpieza','residuos','basura','arrojar','tirar','calle','vía pública','via publica','acera','calzada','papelera','higiene urbana'})
              target['palabras_clave'] = sorted(keywords)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('Revisión completada sin exigir bloques antiguos.')
          PY

      - name: Publicar reparación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html buscadores-core.js data/ordenanzas.json .github/workflows/ajuste-pantalla-buscador.yml
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git commit -m "Ajustar reparación del buscador [auto-repair]"
          git push
