name: Reparar Centinela Code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reparar interfaz
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # El archivo fue eliminado y no debe seguir referenciado.
          for ref in (
              '<script src="./infraccion-assistant.js?v=20260904-v1"></script>',
              '<script src="infraccion-assistant.js?v=20260904-v1"></script>',
              '<script defer src="./infraccion-assistant.js?v=20260904-v1"></script>',
              '<script defer src="infraccion-assistant.js?v=20260904-v1"></script>',
          ):
              s = s.replace(ref, '')

          # Nombre correcto del bloque de estado.
          s = s.replace(
              '<strong>Ley Orgánica 4/2015</strong><small>Comprobando artículos disponibles</small>',
              '<strong>Normativa aplicable</strong><small>Comprobando referencias disponibles</small>',
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar reparación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git commit -m "Reparar carga de Centinela y cambiar etiqueta de normativa [auto-repair]"
          git push
