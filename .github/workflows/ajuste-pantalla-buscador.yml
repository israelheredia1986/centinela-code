name: Ajuste visual buscador Centinela

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/ajuste-pantalla-buscador.yml'

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ !contains(github.event.head_commit.message, '[auto-ajuste-buscador]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar ajuste de utilidades internas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''<div class="cc-global-search-actions">
              <button type="button" data-cc-search-mode="all">🔎 Buscar en todo</button>
              <button type="button" data-cc-search-mode="infractions">⚠ Buscar infracción</button>
            </div>'''

          new = '''<div class="cc-global-search-actions" aria-label="Herramientas de consulta">
              <button type="button" data-cc-search-mode="all" title="Buscar en toda la base normativa local">⌕ CONSULTA GLOBAL</button>
              <button type="button" data-cc-search-mode="infractions" title="Filtrar y localizar infracciones sancionables">⚠ IDENTIFICAR INFRACCIÓN</button>
            </div>'''

          if old in s:
              s = s.replace(old, new, 1)
          else:
              s = s.replace('>🔎 Buscar en todo</button>', '>⌕ CONSULTA GLOBAL</button>', 1)
              s = s.replace('>⚠ Buscar infracción</button>', '>⚠ IDENTIFICAR INFRACCIÓN</button>', 1)

          css = r'''
/* ============================================================
   CENTINELA — UTILIDADES DE CONSULTA
   Los antiguos accesos genéricos pasan a ser herramientas
   internas: consulta global e identificación de infracciones.
   ============================================================ */
.cc-global-search-actions button{
  font-weight:800!important;
  letter-spacing:.35px!important;
  min-height:38px!important;
  border-color:rgba(49,185,255,.26)!important;
  background:linear-gradient(180deg,rgba(49,185,255,.10),rgba(255,255,255,.025))!important;
}
.cc-global-search-actions button[data-cc-search-mode="infractions"]{
  border-color:rgba(255,210,60,.30)!important;
  background:linear-gradient(180deg,rgba(255,205,55,.10),rgba(255,255,255,.025))!important;
}
.cc-global-search-actions button:hover{
  border-color:rgba(49,185,255,.60)!important;
  box-shadow:0 0 14px rgba(49,185,255,.14)!important;
}
'''
          marker = '/* ============================================================\n   CENTINELA — UTILIDADES DE CONSULTA'
          if marker not in s:
              pos = s.rfind('</style>')
              if pos < 0:
                  raise SystemExit('No se encontró </style> en index.html')
              s = s[:pos] + css + '\n' + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar cambio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'El ajuste ya estaba aplicado.'
          else
            git commit -m 'Convertir búsqueda genérica en utilidades internas [auto-ajuste-buscador]'
            git push
          fi
