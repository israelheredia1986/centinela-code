name: Reemplazar acciones genéricas por utilidades internas
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  actualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar botones de consulta
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''<div class="cc-global-search-actions">
              <button type="button" data-cc-search-mode="all">🔎 Buscar en todo</button>
              <button type="button" data-cc-search-mode="infractions">⚠ Buscar infracción</button>
            </div>'''

          new = '''<div class="cc-global-search-actions" aria-label="Herramientas de consulta">
              <button type="button" data-cc-search-mode="all" title="Buscar en toda la base normativa local">⌕ CONSULTA GLOBAL</button>
              <button type="button" data-cc-search-mode="infractions" title="Filtrar y localizar infracciones sancionables">⚠ IDENTIFICAR INFRACCIÓN</button>
            </div>'''

          if old in s:
              s = s.replace(old, new, 1)
          else:
              pattern = r'<div class="cc-global-search-actions"[\\s\\S]*?</div>'
              if not re.search(pattern, s):
                  raise SystemExit('No se encontró el bloque de acciones del buscador global.')
              s = re.sub(pattern, new, s, count=1)

          p.write_text(s, encoding='utf-8')
      - name: Commit y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "UI: convertir botones de búsqueda en utilidades internas"
          git push
      - name: Eliminar workflow temporal
        if: always()
        run: |
          rm -f .github/workflows/insert-global-search.yml
          git add -A
          git commit -m "Eliminar workflow temporal de actualización UI" || exit 0
          git push
