name: Integrar normativa VMP y bicicletas eléctricas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrar:
    if: ${{ !contains(github.event.head_commit.message, '[skip vmp]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrar fuentes VMP en app.js
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          original = s

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'No se encontró el patrón: {label}')
              s = s.replace(old, new, 1)

          once('VERSION: "1.5.0"', 'VERSION: "1.6.0"', 'VERSION')

          once(
              'infraccionesTrafico: "./data/infracciones_trafico.json",',
              'infraccionesTrafico: "./data/infracciones_trafico.json",\n    infraccionesVmpBicicletas: "./data/infracciones_vmp_bicicletas.json",',
              'ruta infracciones VMP'
          )
          once(
              'trafico: "./data/normativa_trafico.json",',
              'trafico: "./data/normativa_trafico.json",\n    vmpBicicletas: "./data/normativa_vmp_bicicletas.json",',
              'ruta normativa VMP'
          )
          once(
              'trafico: null,\n  ley392015:',
              'trafico: null,\n  vmpBicicletas: null,\n  ley392015:',
              'estado VMP'
          )

          once(
              'cargarJSON(CONFIG.RUTAS.infraccionesTrafico),\n    cargarJSON(CONFIG.RUTAS.lopsc),',
              'cargarJSON(CONFIG.RUTAS.infraccionesTrafico),\n    cargarJSON(CONFIG.RUTAS.infraccionesVmpBicicletas),\n    cargarJSON(CONFIG.RUTAS.lopsc),',
              'Promise infracciones VMP'
          )
          once(
              'cargarJSON(CONFIG.RUTAS.animales),\n    cargarJSON(CONFIG.RUTAS.trafico),\n    cargarJSON(CONFIG.RUTAS.leyFcs),',
              'cargarJSON(CONFIG.RUTAS.animales),\n    cargarJSON(CONFIG.RUTAS.trafico),\n    cargarJSON(CONFIG.RUTAS.vmpBicicletas),\n    cargarJSON(CONFIG.RUTAS.leyFcs),',
              'Promise normativa VMP'
          )

          once(
              'rInfracciones, rInfraccionesTrafico, rLopsc, rCodigoPenal, rMenores,',
              'rInfracciones, rInfraccionesTrafico, rInfraccionesVmpBicicletas, rLopsc, rCodigoPenal, rMenores,',
              'destructuración infracciones VMP'
          )
          once(
              'rViolenciaGenero, rOrdenanzas, rAnimales, rTrafico,\n    rLeyFcs,',
              'rViolenciaGenero, rOrdenanzas, rAnimales, rTrafico, rVmpBicicletas,\n    rLeyFcs,',
              'destructuración normativa VMP'
          )

          once(
              'if (rInfraccionesTrafico.status === "fulfilled") { \n    estado.infracciones = estado.infracciones.concat(extraerInfracciones(rInfraccionesTrafico.value)); \n  }',
              'if (rInfraccionesTrafico.status === "fulfilled") { \n    estado.infracciones = estado.infracciones.concat(extraerInfracciones(rInfraccionesTrafico.value)); \n  }\n\n  if (rInfraccionesVmpBicicletas.status === "fulfilled") {\n    estado.infracciones = estado.infracciones.concat(extraerInfracciones(rInfraccionesVmpBicicletas.value));\n  }',
              'carga infracciones VMP'
          )
          once(
              'if (rTrafico.status === "fulfilled") estado.trafico = rTrafico.value;',
              'if (rTrafico.status === "fulfilled") estado.trafico = rTrafico.value;\n  if (rVmpBicicletas.status === "fulfilled") estado.vmpBicicletas = rVmpBicicletas.value;',
              'carga normativa VMP'
          )
          once(
              'agregarGrupoLeyes(estado.trafico, "trafico", "ley-trafico");',
              'agregarGrupoLeyes(estado.trafico, "trafico", "ley-trafico");\n  agregarGrupoLeyes(estado.vmpBicicletas, "vmp-bicicletas", "ley-vmp-bicicletas");',
              'buscador normativa VMP'
          )

          if s == original:
              raise SystemExit('No hubo cambios en app.js')
          p.write_text(s, encoding='utf-8')
          print('Integración VMP aplicada')

      - name: Validar JavaScript
        run: node --check app.js

      - name: Commit integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Integra normativa VMP y bicicletas eléctricas [skip vmp]"
          git push
