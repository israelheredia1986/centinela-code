name: Integrar normativa VMP y bicicletas eléctricas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrar:
    if: ${{ !contains(github.event.head_commit.message, '[skip vmp]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrar fuentes VMP en app.js
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          original = s

          def replace_once(pattern, repl, label, flags=0):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'No se encontró el patrón: {label}')
              s = s2

          replace_once(r'VERSION:\s*"1\.5\.0"', 'VERSION: "1.6.0"', 'VERSION')

          replace_once(
              r'(infraccionesTrafico:\s*"\./data/infracciones_trafico\.json",)',
              r'\1\n    infraccionesVmpBicicletas: "./data/infracciones_vmp_bicicletas.json",',
              'ruta infracciones VMP'
          )
          replace_once(
              r'(trafico:\s*"\./data/normativa_trafico\.json",)',
              r'\1\n    vmpBicicletas: "./data/normativa_vmp_bicicletas.json",',
              'ruta normativa VMP'
          )
          replace_once(
              r'(trafico:\s*null,)(\s*ley392015:)',
              r'\1\n  vmpBicicletas: null,\2',
              'estado VMP'
          )

          replace_once(
              r'(cargarJSON\(CONFIG\.RUTAS\.infraccionesTrafico\),\s*)cargarJSON\(CONFIG\.RUTAS\.lopsc\),',
              r'\1cargarJSON(CONFIG.RUTAS.infraccionesVmpBicicletas),\n    cargarJSON(CONFIG.RUTAS.lopsc),',
              'Promise infracciones VMP'
          )
          replace_once(
              r'(cargarJSON\(CONFIG\.RUTAS\.trafico\),\s*)cargarJSON\(CONFIG\.RUTAS\.leyFcs\),',
              r'\1cargarJSON(CONFIG.RUTAS.vmpBicicletas),\n    cargarJSON(CONFIG.RUTAS.leyFcs),',
              'Promise normativa VMP'
          )

          replace_once(
              r'rInfracciones,\s*rInfraccionesTrafico,\s*rLopsc,\s*rCodigoPenal,\s*rMenores,',
              'rInfracciones, rInfraccionesTrafico, rInfraccionesVmpBicicletas, rLopsc, rCodigoPenal, rMenores,',
              'destructuración infracciones VMP'
          )
          replace_once(
              r'rViolenciaGenero,\s*rOrdenanzas,\s*rAnimales,\s*rTrafico,\s*\n\s*rLeyFcs,',
              'rViolenciaGenero, rOrdenanzas, rAnimales, rTrafico, rVmpBicicletas,\n    rLeyFcs,',
              'destructuración normativa VMP'
          )

          replace_once(
              r'(if \(rInfraccionesTrafico\.status === "fulfilled"\) \{\s*estado\.infracciones = estado\.infracciones\.concat\(extraerInfracciones\(rInfraccionesTrafico\.value\)\);\s*\})',
              r'\1\n\n  if (rInfraccionesVmpBicicletas.status === "fulfilled") {\n    estado.infracciones = estado.infracciones.concat(extraerInfracciones(rInfraccionesVmpBicicletas.value));\n  }',
              'carga infracciones VMP'
          )
          replace_once(
              r'(if \(rTrafico\.status === "fulfilled"\) estado\.trafico = rTrafico\.value;)',
              r'\1\n  if (rVmpBicicletas.status === "fulfilled") estado.vmpBicicletas = rVmpBicicletas.value;',
              'carga normativa VMP'
          )
          replace_once(
              r'(agregarGrupoLeyes\(estado\.trafico,\s*"trafico",\s*"ley-trafico"\);)',
              r'\1\n  agregarGrupoLeyes(estado.vmpBicicletas, "vmp-bicicletas", "ley-vmp-bicicletas");',
              'buscador normativa VMP'
          )

          if s == original:
              raise SystemExit('No hubo cambios en app.js')
          p.write_text(s, encoding='utf-8')
          print('Integración VMP aplicada correctamente')

      - name: Validar JavaScript
        run: node --check app.js

      - name: Commit integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Integra normativa VMP y bicicletas eléctricas [skip vmp]"
          git push
